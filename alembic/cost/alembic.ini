[alembic]
script_location = alembic/cost
sqlalchemy.url = mysql+mysqlconnector://%(COST_DB_USER)s:%(COST_DB_PASSWORD)s@%(COST_DB_HOST)s:%(COST_DB_PORT)s/%(COST_DB_NAME)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
